name: Validate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate packaged README
        run: |
          node --input-type=module -e "import { syncReadme } from './scripts/sync-manifests.mjs'; syncReadme(process.cwd(), true);"
          git diff --exit-code -- plugins/parcel/README.md
      - run: node scripts/validate.mjs
      - name: Validate Claude marketplace and plugin
        run: |
          npm exec --yes --package=@anthropic-ai/claude-code@2.1.282 -- claude plugin validate .
          npm exec --yes --package=@anthropic-ai/claude-code@2.1.282 -- claude plugin validate ./plugins/parcel
      - name: Test and inspect portable archive
        run: |
          node --test scripts/sync-manifests.test.mjs
          python3 -m unittest discover -s scripts -p 'test_*.py'
          python3 scripts/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: parcel-plugin-preview
          path: dist/*
          if-no-files-found: error
